name: ML Prediction Service CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Lint
        run: python -m flake8 app --count

      - name: Prepare Diabetes model for tests
        run: python model/train.py

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/app
          MODEL_PATH: ${{ github.workspace }}/model/model.pkl
        run: python -m pytest -v app/tests

  build-and-push:
    name: Build and push
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/karpovammm/ml-prediction-service/ml-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare model for Docker image
        run: |
          python -m pip install -r app/requirements.txt
          python model/train.py
          test -s model/model.pkl

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: karpovammm
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            -f docker/Dockerfile .

      - name: Push
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to app-server
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, lab5-deploy]
    concurrency:
      group: lab5-app-server-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Update container over SSH
        shell: bash
        env:
          VM2_HOST: ${{ secrets.VM2_HOST }}
          VM2_USER: ${{ secrets.VM2_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Не выкладываем старый запуск поверх более свежего main.
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$main_sha"
          if [[ "$main_sha" != "$IMAGE_TAG" ]]; then
            echo "A newer commit is already on main. Skipping this deployment."
            exit 0
          fi

          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | ssh-add -
          unset SSH_KEY

          target="$VM2_USER@$VM2_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" hostname

          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io -u karpovammm --password-stdin
          unset REGISTRY_TOKEN

          export DOCKER_HOST="ssh://$target"

          project=$(docker inspect \
            -f '{{index .Config.Labels "com.docker.compose.project"}}' ml-app)
          test -n "$project"

          compose=(docker compose --env-file /dev/null
                   -p "$project" -f docker/docker-compose.yml)

          "${compose[@]}" config -q
          "${compose[@]}" pull app
          "${compose[@]}" up -d --no-build --wait --wait-timeout 120 app

          revision=$(docker inspect \
            -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' ml-app)
          test "$revision" = "$IMAGE_TAG"
          echo "Deployed revision: $revision"

          ssh -o BatchMode=yes "$target" \
            'curl -fsS http://127.0.0.1:5000/health'
